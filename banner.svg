<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ronaldo Moraes — Engenheiro de Software Full Stack">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="55%" stop-color="#0B1626" />
      <stop offset="100%" stop-color="#0C2138" />
    </linearGradient>

    <radialGradient id="glowRight" cx="86%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#2E7FFF" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#2E7FFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#2E7FFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowLeft" cx="12%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0" />
      <stop offset="28%" stop-color="#2E7FFF" stop-opacity="0.75" />
      <stop offset="72%" stop-color="#10B981" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7FFF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-opacity="0.065" stroke-width="1" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="318" rx="18" />
    </clipPath>
  </defs>

  <!-- Base Container -->
  <g clip-path="url(#cardClip)">
    <rect width="1200" height="320" fill="url(#bgGrad)" />
    <rect width="1200" height="320" fill="url(#techGrid)" />
    <rect width="1200" height="320" fill="url(#glowRight)" />
    <rect width="1200" height="320" fill="url(#glowLeft)" />

    <!-- Subtle Corner HUD Crosshairs -->
    <path d="M 28 38 L 28 24 L 42 24" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M 1158 24 L 1172 24 L 1172 38" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M 28 282 L 28 296 L 42 296" fill="none" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M 1158 296 L 1172 296 L 1172 282" fill="none" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
  </g>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#1E3A5F" stroke-opacity="0.85" stroke-width="1.5" />

  <!-- LEFT COLUMN: Identity & Architectural Positioning -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Top Eyebrow Pill -->
    <rect x="56" y="42" width="290" height="26" rx="13" fill="#2E7FFF" fill-opacity="0.14" stroke="#2E7FFF" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="72" cy="55" r="4" fill="#10B981" />
    <text x="84" y="59" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#93C5FD">
      FULL STACK ARCHITECT • BRASÍLIA, DF
    </text>

    <!-- Full Name -->
    <text x="56" y="128" font-size="50" font-weight="800" letter-spacing="-1" fill="#F8FAFC">
      Ronaldo Moraes
    </text>

    <!-- Gradient Accent Line -->
    <rect x="56" y="146" width="112" height="3" rx="1.5" fill="url(#accentRule)" />

    <!-- Professional Title -->
    <text x="56" y="182" font-size="19.5" font-weight="600" fill="#60A5FA">
      Engenheiro de Software Full Stack em Brasília, DF
    </text>

    <!-- Value Proposition -->
    <text x="56" y="216" font-size="14.5" font-weight="400" fill="#CBD5E1">
      Arquitetura web de ponta a ponta, plataformas SaaS escaláveis e experiências 3D em WebGL.
    </text>
    <text x="56" y="238" font-size="14.5" font-weight="400" fill="#94A3B8">
      Da modelagem de dados e integrações críticas ao deploy automatizado em Linux VPS.
    </text>

    <!-- Domain Strip -->
    <text x="56" y="278" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#64748B">
      <tspan fill="#38BDF8">ronaldo.social</tspan>
      <tspan fill="#475569">  //  </tspan>
      <tspan fill="#34D399">helpdj.tech</tspan>
      <tspan fill="#475569">  //  </tspan>
      <tspan fill="#CBD5E1">amazoniavivabr.com</tspan>
      <tspan fill="#475569">  //  </tspan>
      <tspan fill="#93C5FD">ronaldolms.online</tspan>
    </text>
  </g>

  <!-- ELEGANT VERTICAL DIVIDER -->
  <line x1="692" y1="40" x2="692" y2="280" stroke="url(#dividerGrad)" stroke-width="1.5" />

  <!-- RIGHT COLUMN: Real Impact Metrics -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Metric 1: NASA Space Apps -->
    <rect x="724" y="46" width="420" height="66" rx="12" fill="#0F172A" fill-opacity="0.68" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1" />
    <rect x="738" y="61" width="52" height="36" rx="8" fill="#F59E0B" fill-opacity="0.16" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1" />
    <text x="764" y="85" text-anchor="middle" font-size="17" font-weight="800" fill="#FBBF24">1º</text>
    <text x="804" y="74" font-size="14" font-weight="700" fill="#F8FAFC">
      Lugar NASA Space Apps Challenge
    </text>
    <text x="804" y="95" font-size="12" fill="#94A3B8">
      Etapa regional Belém/PA • Global Nominee
    </text>

    <!-- Metric 2: helpDJ SaaS -->
    <rect x="724" y="127" width="420" height="66" rx="12" fill="#0F172A" fill-opacity="0.68" stroke="#2E7FFF" stroke-opacity="0.3" stroke-width="1" />
    <rect x="738" y="142" width="52" height="36" rx="8" fill="#2E7FFF" fill-opacity="0.18" stroke="#2E7FFF" stroke-opacity="0.55" stroke-width="1" />
    <text x="764" y="165" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5" font-weight="800" fill="#60A5FA">SaaS</text>
    <text x="804" y="155" font-size="14" font-weight="700" fill="#F8FAFC">
      helpDJ em produção (P2P)
    </text>
    <text x="804" y="176" font-size="12" fill="#94A3B8">
      Split de pagamento e verificação biométrica Didit
    </text>

    <!-- Metric 3: Creative Dev 3D -->
    <rect x="724" y="208" width="420" height="66" rx="12" fill="#0F172A" fill-opacity="0.68" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <rect x="738" y="223" width="52" height="36" rx="8" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.55" stroke-width="1" />
    <text x="764" y="247" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="15" font-weight="800" fill="#34D399">3D</text>
    <text x="804" y="236" font-size="14" font-weight="700" fill="#F8FAFC">
      Creative Dev &amp; Engenharia Web
    </text>
    <text x="804" y="257" font-size="12" fill="#94A3B8">
      React, Laravel, Three.js e Linguagem C
    </text>
  </g>
</svg>
